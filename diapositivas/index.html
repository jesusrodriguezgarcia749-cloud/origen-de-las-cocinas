<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diapositivas · Origen de las Cocinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
  :root{--marino:#252734;--rojo:#AA2F2F;--beige:#F4F2ED;--arena:#DDD6C8;--tinta:#1A1A1A;--gris:#5C5A55}
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--beige);color:var(--tinta);font-family:"Public Sans",Calibri,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  header{background:var(--marino);color:#fff;border-bottom:8px solid var(--rojo)}
  .wrap{max-width:780px;margin:0 auto;padding:0 20px}
  header .wrap{padding-top:22px;padding-bottom:30px}
  .volver{display:inline-block;color:#fff;border:2px solid var(--arena);padding:6px 12px;text-decoration:none;font-weight:500;font-size:.95rem}
  .volver:focus-visible,.clase:focus-visible{outline:3px solid var(--rojo);outline-offset:2px}
  h1{font-family:"Fraunces",Cambria,Georgia,serif;font-weight:700;font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin:26px 0 8px}
  header p{color:var(--arena);margin:0;line-height:1.5}
  main{padding:28px 0 56px}
  h2{font-family:"Fraunces",Cambria,Georgia,serif;font-weight:600;font-size:1.35rem;color:var(--marino);margin:30px 0 10px}
  ol{list-style:none;margin:0;padding:0}
  .clase{display:grid;grid-template-columns:7.2em 1fr;gap:4px 16px;padding:16px 6px;border-top:1px solid var(--arena);text-decoration:none;color:inherit}
  li:last-child .clase{border-bottom:1px solid var(--arena)}
  a.clase:hover .titulo{color:var(--rojo)}
  .sin-enlace{background:#ECE8DF}
  .sin-enlace .titulo::after{content:" · en cocina";font-family:"Public Sans",sans-serif;font-size:.8rem;font-weight:500;color:var(--gris)}
  .fecha{grid-row:span 2;font-weight:600;color:var(--rojo);font-size:.9rem;padding-top:3px}
  .titulo{font-family:"Fraunces",serif;font-weight:600;font-size:1.2rem;line-height:1.25;color:var(--marino)}
  .desc{color:var(--gris);line-height:1.45;font-size:.95rem}
  .vacia{border:3px dashed var(--gris);color:var(--gris);padding:24px;text-align:center}
  @media (max-width:480px){.clase{grid-template-columns:1fr}.fecha{grid-row:auto}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="volver" href="../index.html">Volver a Origen de las Cocinas</a>
  <h1>Diapositivas de clase</h1>
  <p>Elige una sesión para repasar el tema. Avanza con las flechas o deslizando el dedo.</p>
</div></header>
<main class="wrap" id="lista"></main>

<!-- =====================================================================
     LISTA DE SESIONES — agrega un renglón por cada presentación nueva
     ===================================================================== -->
<script>
const SESIONES = [
  { tema: "Tema 3 · Cocinas en el mundo", fecha: "Jue 22 oct",
    archivo: "3-1-cocinas-africanas.html",
    titulo: "3.1 Cocinas africanas",
    descripcion: "El Magreb, el comercio transahariano, las 4 regiones de África y la diáspora." },
  { tema: "Tema 3 · Cocinas en el mundo", fecha: "Vie 23 oct",
    archivo: "3-2-mexico-prehispanico.html",
    titulo: "3.2 México prehispánico y mestizo",
    descripcion: "Sahagún, el cacao, las chinampas, el pib maya y la herencia de dos mundos." },
  { tema: "Tema 3 · Cocinas en el mundo", fecha: "Jue 29 oct",
    titulo: "Práctica de cocina 2",
    descripcion: "Cochinita pibil, mole poblano simplificado, pan de cazón o queso relleno. Grupo dividido en dos mitades. Uniforme completo y cuchillo propio." },
  { tema: "Tema 3 · Cocinas en el mundo", fecha: "Vie 30 oct",
    archivo: "3-2-campeche-america.html",
    titulo: "3.2 Campeche y el resto de América",
    descripcion: "Piratas, murallas y queso relleno; el chuño andino, la feijoada y el asado del Cono Sur." },
  { tema: "Tema 3 · Cocinas en el mundo", fecha: "Jue 5 nov",
    archivo: "3-3-cocinas-asiaticas.html",
    titulo: "3.3 Cocinas asiáticas",
    descripcion: "China, Japón y Corea; la India y el curry; el Galeón de Manila; Medio Oriente y la Ruta de la Seda." },
  { tema: "Tema 3 · Cocinas en el mundo", fecha: "Vie 6 nov",
    archivo: "3-4-cocinas-europeas.html",
    titulo: "3.4 Cocinas europeas",
    descripcion: "Los 4 bloques: mediterráneo, Centroeuropa y Este, nórdico e Islas Británicas; Francia y Catalina de Médici." },
  { tema: "Tema 3 · Cocinas en el mundo", fecha: "Jue 12 nov",
    archivo: "3-5-cocinas-oceania.html",
    titulo: "3.5 Cocinas de Oceanía · cierre del Tema 3",
    descripcion: "El hangi maorí, el bushfood australiano, las islas del Pacífico, Hawái y el repaso general del tema." },
  { tema: "Tema 4 · La comida y el poder", fecha: "Vie 13 nov",
    archivo: "4-1-4-2-necesidad-roma.html",
    titulo: "4.1 y 4.2 Necesidad de alimentarse e influencia de Roma",
    descripcion: "De la necesidad biológica a la cultura, el reverso del hambre, Apicio y la herencia del Imperio." },
  { tema: "Tema 4 · La comida y el poder", fecha: "Jue 19 nov",
    archivo: "4-3-comida-realeza.html",
    titulo: "4.3 La comida en la realeza",
    descripcion: "El grand couvert de Versalles, las cocinas del Topkapi, la Ciudad Prohibida y el biryani mogol." },
  { tema: "Tema 4 · La comida y el poder", fecha: "Vie 20 nov",
    archivo: "4-4-primer-restaurante.html",
    titulo: "4.4 El primer restaurante · repaso Parcial 2",
    descripcion: "Boulanger y los caldos restaurativos, la Revolución, Delmonico's, el Porfiriato y las fondas." },
  { tema: "Tema 4 · La comida y el poder", fecha: "Jue 3 dic",
    archivo: "4-5-cocina-profesional.html",
    titulo: "4.5 La cocina profesional · cierre del libro",
    descripcion: "Escoffier y la brigada, Le Cordon Bleu, las mujeres en la cocina, la UNESCO y el Bocuse d'Or." }
];
</script>

<script>
(function () {
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const cont = document.getElementById("lista");
  if (!SESIONES.length) { cont.innerHTML = '<p class="vacia">Todavía no hay presentaciones.</p>'; return; }
  const grupos = [];
  SESIONES.forEach(s => {
    let g = grupos.find(x => x.tema === s.tema);
    if (!g) grupos.push(g = { tema: s.tema, items: [] });
    g.items.push(s);
  });
  cont.innerHTML = grupos.map(g => `
    <h2>${esc(g.tema)}</h2>
    <ol>${g.items.map(s => `
      <li>${s.archivo
        ? `<a class="clase" href="${esc(s.archivo)}">`
        : `<div class="clase sin-enlace">`}
        <span class="fecha">${esc(s.fecha)}</span>
        <span class="titulo">${esc(s.titulo)}</span>
        <span class="desc">${esc(s.descripcion)}</span>
      ${s.archivo ? "</a>" : "</div>"}</li>`).join("")}</ol>`).join("");
})();
</script>
</body>
</html>
